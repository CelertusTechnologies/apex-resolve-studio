name: Deploy Apex SSR App

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v0.1.10

        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22

          script: |
            cd /var/www/apex-resolve-studio

            git pull origin main

            npm install

            npm run build

            pm2 restart apex || pm2 start "npm run preview -- --host 0.0.0.0" --name apex
